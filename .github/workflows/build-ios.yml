name: Build iOS app (simulator)

on:
  push:
    branches: ["main"]
    paths:
      - "src/cards/**"
      - "app/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate cards.json from src/cards
        run: node scripts/build-cards-json.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Sync Capacitor (copies www/ into the native ios project)
        working-directory: app
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: app/ios/App
        run: pod install

      - name: Build for the iOS Simulator (unsigned)
        working-directory: app/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

# There's no Apple Developer account wired up yet, so this workflow only
# proves the app builds — it targets the Simulator and skips code signing,
# which means it can't produce an .ipa you can install on a real device or
# submit to TestFlight/App Store. Once you enroll in the Apple Developer
# Program ($99/yr), come back to add: a signing certificate + provisioning
# profile (or an App Store Connect API key), switch the destination to
# `generic/platform=iOS`, and add an `xcodebuild -exportArchive` step to
# produce a real .ipa.

name: Build Android app

on:
  push:
    branches: ["main"]
    paths:
      - "src/cards/**"
      - "app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate cards.json from src/cards
        run: node scripts/build-cards-json.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Sync Capacitor (copies www/ into the native android project)
        working-directory: app
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      
      - name: Ensure gradlew is executable
        working-directory: app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truth-factory-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# This produces an unsigned debug APK you can sideload onto a device or an
# emulator right away — no Google Play account needed. When you're ready to
# publish to the Play Store, add a signing config + a keystore stored as a
# repo secret, and switch the last two steps to `assembleRelease` /
# `bundleRelease`.
